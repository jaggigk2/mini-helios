spring.application.name=telemetry-ingest
# Where the stream lives: the namespace's Kafka endpoint (port 9093). EH_NAMESPACE comes from an env var
spring.kafka.bootstrap-servers=${EH_NAMESPACE}.servicebus.windows.net:9093
# Encrypt traffic (SSL) and log in with a username/password (SASL)
spring.kafka.properties.security.protocol=SASL_SSL
# PLAIN = simple username/password login (safe here because SSL encrypts it)
spring.kafka.properties.sasl.mechanism=PLAIN
# Login: Event Hubs' fixed username "$ConnectionString" + the connection string from env var EH_CONNECTION_STRING (lab only; prod = Managed Identity)
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EH_CONNECTION_STRING}";
# Wait for Event Hubs to confirm each event is safely stored before treating it as sent
spring.kafka.producer.acks=all